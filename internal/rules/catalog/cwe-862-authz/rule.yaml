rules:
  # ---------------------------------------------------------------
  # CWE-862: Missing Authorization — Resource mutated without
  # preceding permission/ownership check.
  #
  # Pattern: a resource is fetched by ID/key, then a mutating
  # operation (delete/update/remove) is performed on it, with
  # no intervening permission/authorization check call.
  #
  # Verified against:
  #   - CVE-2026-58438 / GHSA-xv9x-fj9g-vj6h (Gitea):
  #     RemoveDependency fetched a cross-repo issue by global ID
  #     (GetIssueByID) and deleted it without any permission check,
  #     while sibling AddDependency correctly called
  #     GetDoerRepoPermission + CanReadIssuesOrPulls first.
  #   - CVE-2026-25038 / GHSA-v73x-hx65-6pf4 (Gitea):
  #     Org label routes lacked authorization middleware.
  #     This pattern is route-registration-level (not function-body)
  #     and is NOT covered by this rule — see Limitations below.
  #
  # Limitations:
  #   - Route/middleware-level authorization gaps (pattern #2 above)
  #     are not expressible as function-body Semgrep patterns.
  #     This rule only covers in-function missing-check patterns.
  #   - Cannot distinguish user-provided IDs from hardcoded numeric
  #     constants (requires taint analysis, Semgrep Pro only).
  #     String-literal lookup keys ARE excluded via pattern-not.
  #   - Matches by function-name convention (regex), not data flow.
  #     Functions with unconventional names may be missed (false
  #     negatives) or matched incorrectly (false positives).
  # ---------------------------------------------------------------
  - id: authz-missing-ownership-check
    patterns:
      - pattern-either:
          # Multi-return assignment (val, err := Fn(...))
          - pattern: |
              $RESOURCE, $ERR := $FETCH_FN(...)
              ...
              $MUTATE_FN(..., $RESOURCE, ...)
          - pattern: |
              $RESOURCE, $ERR = $FETCH_FN(...)
              ...
              $MUTATE_FN(..., $RESOURCE, ...)
      # Constrain $FETCH_FN: name suggests lookup by ID/key/name
      - metavariable-regex:
          metavariable: $FETCH_FN
          regex: (?i).*(?:Get|Find|Fetch|Load|Lookup|Resolve|Retrieve).*By.?(?:ID|Key|Name|Slug|Index).*
      # Constrain $MUTATE_FN: name suggests destructive/modifying action
      - metavariable-regex:
          metavariable: $MUTATE_FN
          regex: (?i).*(?:Delete|Remove|Update|Modify|Destroy|Drop|Revoke).*
      # Exclude when lookup key is a string literal — not user-controllable.
      # "..." in Semgrep pattern position matches any string literal.
      - pattern-not: |
          $RESOURCE, $ERR := $FETCH_FN(..., "...", ...)
          ...
          $MUTATE_FN(..., $RESOURCE, ...)
      - pattern-not: |
          $RESOURCE, $ERR = $FETCH_FN(..., "...", ...)
          ...
          $MUTATE_FN(..., $RESOURCE, ...)
      # Exclude when a permission/authorization check occurs after fetch.
      # Uses metavariable-regex to match any function name containing
      # common permission-check naming patterns (case-insensitive).
      - pattern-not-inside:
          patterns:
            - pattern-either:
                - pattern: |
                    $RESOURCE, $ERR := $FETCH_FN(...)
                    ...
                    $PERM_FN(...)
                    ...
                - pattern: |
                    $RESOURCE, $ERR = $FETCH_FN(...)
                    ...
                    $PERM_FN(...)
                    ...
            - metavariable-regex:
                metavariable: $PERM_FN
                regex: (?i).*(?:Permission|Authorize|CanRead|CanWrite|CanAccess|Ownership|CheckAccess|IsOwner|HasAccess|HasPermission|IsAuthorized|IsAllowed|VerifyAccess|CheckPermission|RequirePermission).*

    severity: WARNING

    message: >-
      Missing authorization check (CWE-862): a resource is fetched by ID/key
      and then mutated (deleted/updated/removed) in the same function scope
      with no intervening permission or ownership check. If the resource ID
      originates from user input, an attacker may manipulate resources they
      do not own or have access to. Fix: verify the requesting user has
      appropriate permission to access and modify the fetched resource
      before performing the mutation — e.g., check repository/org membership,
      resource ownership, or role-based access.

    metadata:
      cwe:
        - "CWE-862: Missing Authorization"
      confidence: MEDIUM
      impact: HIGH
      category: security
      owasp:
        - A01:2021 - Broken Access Control
      references:
        - "https://github.com/go-gitea/gitea/security/advisories/GHSA-xv9x-fj9g-vj6h"
        - "https://github.com/go-gitea/gitea/security/advisories/GHSA-v73x-hx65-6pf4"

    languages:
      - go
